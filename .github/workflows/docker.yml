name: docker

# Builds the image from the source, tests it, then publishes it to Docker Hub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: tresor4k/creavores-aeo-mcp

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # package.json has no "test" script: the smoke test is run directly.
      # Its network calls (lescreavores.fr) only WARN on failure; the tool list is strict.
      - name: Smoke test (source)
        run: npm ci && node test/smoke.mjs

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: creavores-aeo-mcp:test

      - name: Test the image
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id creavores-aeo-mcp:test -u)" = "1000"
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
            sleep 5
          } | docker run -i --rm creavores-aeo-mcp:test > out.jsonl
          jq -c 'del(.result.tools) | tostring | .[0:300]' out.jsonl
          jq -e -s --arg v "${{ steps.v.outputs.version }}" '
            (map(select(.id == 1))[0].result.serverInfo.name == "creavores-aeo-mcp")
            and (map(select(.id == 1))[0].result.serverInfo.version == $v)
            and ((map(select(.id == 2))[0].result.tools | map(.name) | sort)
                 == (["audit_aeo","check_agentic_readiness","check_direct_answer","check_eeat_signals","check_llms_txt","compare_aeo","extract_structured_data","simulate_ai_citation"]))
          ' out.jsonl

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=creavores-aeo-mcp
            org.opencontainers.image.description=MCP server (stdio) for AEO / AI-search audits of any URL: 8 tools, free, no API key.
            org.opencontainers.image.url=https://lescreavores.fr/outils/audit-aeo-gratuit/
            org.opencontainers.image.source=https://github.com/tresor4k/creavores-aeo-mcp
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Inspect the published image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.v.outputs.version }}"
